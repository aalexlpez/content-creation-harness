  - Tres niveles de texto: frase (minúsculas, palabra a palabra) · clave (grande, en color, con su entrada) · escenario
    (gigante detrás de la persona, con el matte de remove-background).
  - Vocabulario: Subida (frase), Letras (METAS), Golpe (APP), Máquina (GANAS), Barrido (PLANEO), Deslizar (ENERO),
    Rodar ($ → GRATIS), Pop de icono (Plan B), Nacer del gesto («Plan B» de la base).
  - Color (PROPUESTA AV-014): el producto en su violeta (#6229EB) y su lima (#C8E65A); las demás claves en ámbar (#FFB547).
  Todo es función del tiempo: render(t). Tiempos de las palabras: palabras.js (base).

<script>
(function () {
  const D = 12.95, W = window.PALABRAS;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const mix = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, d) => clamp01((t - a) / d);
  const easeIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p * p;
  const expoOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
  const backOut = (p, c1 = 1.7) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const GLOW = "drop-shadow(0 0 10px rgba(245,246,248,0.5)) drop-shadow(0 0 24px rgba(245,246,248,0.2))";
  const clean = (s) => s.replace(/[.,:;!?¿¡]/g, "");
  const wt = (txt, k = 1) => W.filter((w) => clean(w[0]).toLowerCase() === txt)[k - 1][1];

  // ── Recursos (de la base)
  const BR = [{ c: "R01", a: 1.90, b: 3.25, m: "over" }, { c: "R02", a: 5.25, b: 6.90, m: "full" }, { c: "R04", a: 7.32, b: 9.02, m: "over" }];
  BR.forEach((r) => { r.el = $("br" + r.c); r.v = r.el.querySelector(".fv"); r.cd = r.el.querySelector(".cd"); });
  const brAt = (t) => BR.find((r) => t >= r.a && t < r.b);

  // ── Nivel 1: frases (la palabra clave sale de la línea y va debajo, en grande)
  const KEYS = { metas: "kMetas", app: "kApp", ganas: "kGanas", planeo: "kPlaneo" };
  const GROUPS = [["todos", "los", "años"], ["dejo", "mis", "metas"], ["en", "enero"], ["pero", "este", "año"], ["hice", "una", "app"],
    ["y", "no", "es", "falta", "de", "ganas"], ["solo", "que", "no", "planeo"], ["el", "día", "en", "que"], ["no", "las", "tengo"],
    ["por", "eso", "hice"], ["es", "gratis", "y"], ["funciona", "así"]];
  const G = []; { let i = 0;
    GROUPS.forEach((g) => { const ws = []; g.forEach((tok) => { while (clean(W[i][0]).toLowerCase() !== tok) i++; ws.push(W[i]); i++; }); G.push(ws); });   // «plan B» se salta: va en las manos
    G.forEach((g, k) => { const nx = G[k + 1]; g.a = g[0][1] - 0.04; g.b = nx ? Math.min(nx[0][1] - 0.04, g[g.length - 1][2] + 0.7) : D; });
    G[1].b = Math.min(G[1].b, 1.90);                         // la tarjeta R01 llega en 1,90
  }
  const HIDE = [[9.86, 11.25]];                              // «Plan B» de las manos: sin subtítulos
  const line = $("line"); let shown = -1;
  function captions(t) {
    let gi = -1; G.forEach((g, i) => { if (t >= g.a && t < g.b) gi = i; });
    if (HIDE.some(([a, b]) => t >= a && t < b)) gi = -1;
    if (gi !== shown) { line.innerHTML = gi < 0 ? "" : G[gi].filter((w) => !KEYS[clean(w[0]).toLowerCase()]).map((w) => `<span>${clean(w[0]).toLowerCase()}</span>`).join(""); shown = gi; }
    if (gi < 0) return;
    const g = G[gi], br = brAt(t), y = br && br.m === "over" ? 1430 : 1035;   // por encima de la estampa de la camiseta
    line.style.top = y + "px";
    const words = g.filter((w) => !KEYS[clean(w[0]).toLowerCase()]);
    const out = easeIn(prog(t, g.b - 0.18, 0.18));
    [...line.children].forEach((sp, i) => { const w = words[i]; const e = expoOut(prog(t, w[1] - 0.04, 0.32));
      sp.style.opacity = (clamp01((t - w[1] + 0.04) / 0.12) * (1 - out)).toFixed(3);
      sp.style.transform = `translateY(${(14 * (1 - e) - 18 * out).toFixed(1)}px)`;
      sp.style.filter = `blur(${(6 * (1 - e) + 6 * out).toFixed(1)}px)`; });
  }
  const keyTop = () => 1105;   // las claves van fuera de las tarjetas: posición fija (no saltan cuando entra una)

  // ── Capa flotante
  const ICON = `<div class="tile"><img src="assets/planb_icon.png" alt=""></div><div class="tlab">Plan B</div>`;
  const NODES = [
    { id: "tile", x: 885, y: 640, w: 200, h: 214, d: 1.0, show: [[4.42, 5.25], [9.02, 12.95]], move: 0, ent: "pop" },
    { id: "logo", x: 215, y: 330, w: 340, h: 100, d: 0.9, show: [[9.14, 11.30]], ent: "slideL", html: `<div class="gl pill"></div><img src="assets/logo-monocromo-blanco.svg" style="position:absolute;left:44px;top:26px;width:252px;height:auto" alt="">` },
    { id: "mini", x: 885, y: 900, w: 300, h: 70, d: 0.9, show: [[10.62, 12.62]], ent: "letters",
      html: `<div class="gl pill" style="background:var(--violet);border-color:var(--violet)"></div><div class="txt" id="miniT" style="top:18px;font-size:34px;letter-spacing:.06em"></div>` },
    { id: "price", x: 885, y: 1060, w: 330, h: 150, d: 0.9, show: [[11.20, 12.62]], ent: "slideR",
      html: `<div class="gl"></div><div class="txt" style="top:20px;font-size:26px;font-weight:700;color:#B7C0CC;letter-spacing:.08em">PRECIO</div><div class="roll"><div id="pA">$</div><div id="pB" style="color:var(--lime)">GRATIS</div></div>` },
  ];
  NODES[0].html = ICON;
  const NB = {}; NODES.forEach((n, i) => { NB[n.id] = n; n.ph = (i * 2.399) % TAU; n.px = 3.4 + (i % 4) * 0.6; n.py = 4.2 + (i % 3) * 0.7; });
  const fl = $("fl");
  NODES.forEach((n) => { const el = document.createElement("div"); el.className = "nd"; el.style.width = n.w + "px"; el.style.height = n.h + "px"; el.innerHTML = n.html; fl.appendChild(el); n.el = el; });
  { const m = $("miniT"); m.innerHTML = "MINIAPP 01".split("").map((c) => `<span class="ch" style="display:inline-block">${c === " " ? "&nbsp;" : c}</span>`).join(""); }
  const pos = (n, t) => { const m = n.move === 0 ? 0 : 1; return [n.x + (5 + 9 * n.d) * m * Math.sin(TAU * t / (n.px * 2.2) + n.ph), n.y + (4 + 8 * n.d) * m * Math.sin(TAU * t / (n.py * 2.2) + n.ph * 1.7)]; };
  const ivAt = (n, t) => n.show.find(([a, b]) => t >= a && t < b);

  // Flecha (arco con punto que viaja): del logo al icono
  const SV = "http://www.w3.org/2000/svg", ar = $("ar");
  const ARW = { t0: 9.55, t1: 11.30 };
  ARW.p = document.createElementNS(SV, "path"); ARW.p.setAttribute("pathLength", "1"); ARW.p.setAttribute("stroke-dasharray", "1 1"); ar.appendChild(ARW.p);
  ARW.o = document.createElementNS(SV, "circle"); ARW.o.setAttribute("r", "7"); ARW.o.setAttribute("fill", "#C8E65A"); ar.appendChild(ARW.o);

  // ── Cámara (de la base): arranque 1,12 → 1, pico 1 a 1,10, empalmes, deriva por plano
  const ZP = [[4.42, 1.10], [4.85, 1.0], [9.02, 1.07]];
  const SHOTS = [0, 4.42, 4.85, 6.90, 9.02, 12.62, D];
  const zAt = (t) => { if (t < 4.42) return mix(1.12, 1, easeOut(prog(t, 0, 0.45))); let z = 1; ZP.forEach(([a, v]) => { if (t >= a) z = v; }); return z; };
  const drift = (t) => { let i = 0; while (i < SHOTS.length - 1 && t >= SHOTS[i + 1]) i++; return 1 + 0.03 * easeIO(prog(t, SHOTS[i], SHOTS[i + 1] - SHOTS[i])); };

  function render(t) {
    // Cámara y golpe del pico 1
    let shake = 0; if (t >= 4.42 && t < 4.8) shake = 7 * Math.exp(-12 * (t - 4.42)) * Math.sin(42 * (t - 4.42));
    const grow = easeIn(prog(t, 12.62, 0.33));             // final: entramos en la app
    $("vwrap").style.transform = `translateY(${shake.toFixed(2)}px) scale(${(zAt(t) * drift(t) * (1 + 0.25 * grow)).toFixed(4)})`;
    $("vwrap").style.filter = grow > 0 ? `blur(${(14 * grow).toFixed(1)}px)` : "none";
    $("pm").style.opacity = t < 4.85 ? 1 : 0;

    // Nivel 3 · ENERO detrás de la persona: Deslizar desde la izquierda (pasado) y salir por la izquierda
    { const el = $("sEnero"), a = 2.18, b = 3.05, e = expoOut(prog(t, a - 0.05, 0.42)), x = easeIn(prog(t, b, 0.3));
      el.style.opacity = t < a - 0.05 || t > b + 0.3 ? 0 : (clamp01((t - a + 0.05) / 0.15) * (1 - x)).toFixed(3);
      el.style.transform = `translateX(${(-420 * (1 - e) - 520 * x).toFixed(1)}px)`;
      el.style.filter = `blur(${(16 * (1 - e) + 14 * x).toFixed(1)}px)`; }

    // Recursos
    const br = brAt(t);
    BR.forEach((r) => {
      if (r !== br) { r.el.style.opacity = 0; return; }
      r.el.style.opacity = 1;
      const e = expoOut(prog(t, r.a, 0.3)), x = easeIn(prog(t, r.b - 0.18, 0.18)), push = 1 + 0.05 * prog(t, r.a, r.b - r.a);
      if (r.m === "full") r.v.style.transform = `scale(${(mix(1.08, 1, e) * push).toFixed(4)})`;
      else { r.cd.style.transform = `translateY(${(40 * (1 - e) + 30 * x).toFixed(1)}px) rotate(${(-3 + 1.2 * prog(t, r.a, r.b - r.a)).toFixed(2)}deg) scale(${(mix(0.92, 1, e) * mix(1, 0.94, x)).toFixed(4)})`; r.cd.style.opacity = (1 - x).toFixed(3); }
    });

    // Promesa: Barrido de izquierda a derecha; sale hacia arriba cuando entra ENERO
    { const p = $("prom"), a = 0.30, rev = easeOut(prog(t, a, 0.45)), x = easeIn(prog(t, 1.95, 0.25));
      p.style.opacity = t < a ? 0 : (1 - x).toFixed(3);
      p.style.clipPath = `inset(-20px ${(100 * (1 - rev)).toFixed(1)}% -20px -20px)`;
      p.style.transform = `translateY(${(-40 * x).toFixed(1)}px)`; p.style.filter = `blur(${(8 * x).toFixed(1)}px)`; }

    // Nivel 1
    captions(t);

    // Nivel 2 · METAS: Letras (cada letra sube con 1 fotograma de desfase); sale cayendo
    { const el = $("kMetas"), a = wt("metas"), b = 1.88;
      el.style.top = keyTop(t) + "px"; el.style.opacity = t >= a - 0.02 && t < b + 0.25 ? 1 : 0;
      [...el.children].forEach((c, i) => { const e = backOut(prog(t, a + i * 0.033, 0.3), 1.2), x = easeIn(prog(t, b + i * 0.02, 0.2));
        c.style.opacity = (prog(t, a + i * 0.033, 0.08) * (1 - x)).toFixed(3); c.style.transform = `translateY(${(60 * (1 - e) + 50 * x).toFixed(1)}px)`; }); }

    // Nivel 2 · APP: Golpe en caja violeta (producto) con la batería del pico 1; sale empujada por el corte
    { const el = $("kApp"), a = 4.34, b = 4.85, e = backOut(prog(t, a, 0.24), 2.0), x = easeIn(prog(t, b - 0.08, 0.12));
      el.style.top = (keyTop(t) - 20) + "px"; el.style.opacity = t >= a && t < b + 0.05 ? (1 - x).toFixed(3) : 0;
      el.style.transform = `scale(${(mix(1.6, 1, e) * mix(1, 0.85, x)).toFixed(3)})`; el.style.filter = `blur(${(10 * x).toFixed(1)}px)`; }

    // Nivel 2 · GANAS: Máquina (una letra por fotograma, con cursor); se borra hacia atrás
    { const el = $("kGanas"), a = wt("ganas"), b = 6.25, txt = "GANAS";
      const n = t < a ? 0 : Math.min(txt.length, Math.floor((t - a) * 30 / 2) + 1), back = t >= b ? Math.min(txt.length, Math.floor((t - b) * 30)) : 0;
      el.style.top = keyTop(t) + "px"; el.style.opacity = t >= a && t < b + 0.2 ? 1 : 0;
      $("kGanasT").textContent = txt.slice(0, Math.max(0, n - back));
      $("kGanasC").style.opacity = Math.floor(t * 4) % 2 === 0 || t < a + 0.35 ? 1 : 0; }

    // Nivel 2 · PLANEO: Barrido (máscara de izquierda a derecha); sale barriéndose hacia la derecha
    { const el = $("kPlaneo"), a = wt("planeo"), b = 7.28, r = easeOut(prog(t, a, 0.35)), x = easeIn(prog(t, b, 0.22));
      el.style.top = keyTop(t) + "px"; el.style.opacity = t >= a && t < b + 0.22 ? 1 : 0;
      el.style.clipPath = `inset(-30px ${(100 * (1 - r)).toFixed(1)}% -30px ${(100 * x).toFixed(1)}%)`;
      el.style.transform = `translateX(${(-30 * (1 - r) + 40 * x).toFixed(1)}px)`; }

    // Capa flotante (se apaga bajo los recursos)
    NODES.forEach((n) => {
      const iv = ivAt(n, t);
      if (!iv || br) { n.el.style.opacity = 0; return; }
      const [a, b] = iv, p = pos(n, t), e = prog(t, a, 0.5), x = easeIn(prog(t, b - 0.3, 0.3));
      let tx = 0, ty = 0, sc = 1, bl = 0, op = 1;
      if (n.ent === "pop") { sc = clamp01(backOut(prog(t, a, 0.42), 2.2)) * mix(1, 0.8, x); bl = 12 * (1 - expoOut(e)); ty = 20 * x; }
      else if (n.ent === "slideL") { tx = -260 * (1 - expoOut(e)) - 200 * x; bl = 12 * (1 - expoOut(e)) + 10 * x; }
      else if (n.ent === "slideR") { tx = 260 * (1 - expoOut(e)) + 200 * x; bl = 12 * (1 - expoOut(e)) + 10 * x; }
      else if (n.ent === "letters") { sc = mix(0.9, 1, expoOut(e)); bl = 6 * x; ty = 20 * x; }
      op = clamp01(e * 3) * (1 - x);
      if (n.id === "tile" && t >= 12.62) { const g = easeIn(prog(t, 12.62, 0.33)); sc = mix(1, 3.2, g); tx = mix(0, 540 - p[0], g); ty = mix(0, 880 - p[1], g); op = 1; bl = 0; }
      n.el.style.opacity = op.toFixed(3);
      n.el.style.transform = `translate(${(p[0] - n.w / 2 + tx).toFixed(1)}px, ${(p[1] - n.h / 2 + ty).toFixed(1)}px) scale(${sc.toFixed(4)})`;
      n.el.style.filter = bl > 0.05 ? `blur(${bl.toFixed(1)}px)` : "none";
    });
    // MINIAPP 01: Letras
    { const a = 10.62; [...$("miniT").children].forEach((c, i) => { const e = expoOut(prog(t, a + 0.1 + i * 0.03, 0.28)); c.style.opacity = prog(t, a + 0.1 + i * 0.03, 0.06).toFixed(3); c.style.transform = `translateY(${(26 * (1 - e)).toFixed(1)}px)`; }); }
    // PRECIO: Rodar «$ ——» → «GRATIS» en «gratis»
    { const g0 = wt("gratis"), r = easeIO(prog(t, g0 + 0.05, 0.35));
      $("pA").style.transform = `translateY(${(-74 * r).toFixed(1)}px)`; $("pB").style.transform = `translateY(${(74 * (1 - r)).toFixed(1)}px)`; }

    // Arco del logo al icono
    { const on = t >= ARW.t0 && t < ARW.t1 && !br, fade = 1 - prog(t, ARW.t1 - 0.3, 0.3);
      if (!on) { ARW.p.style.opacity = 0; ARW.o.style.opacity = 0; } else {
        const A = pos(NB.logo, t), B = pos(NB.tile, t); A[0] += 180; B[1] -= 115;
        const cx = (A[0] + B[0]) / 2, cy = 170;
        ARW.p.setAttribute("d", `M ${A[0].toFixed(1)} ${A[1].toFixed(1)} Q ${cx.toFixed(1)} ${cy} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
        ARW.p.setAttribute("stroke-dashoffset", (1 - easeOut(prog(t, ARW.t0, 0.55))).toFixed(3)); ARW.p.style.opacity = fade.toFixed(3);
        const u = clamp01((t - ARW.t0 - 0.3) / 0.9), v = 1 - u;
        ARW.o.setAttribute("cx", (v * v * A[0] + 2 * v * u * cx + u * u * B[0]).toFixed(1)); ARW.o.setAttribute("cy", (v * v * A[1] + 2 * v * u * cy + u * u * B[1]).toFixed(1));
        ARW.o.style.opacity = (prog(t, ARW.t0 + 0.3, 0.1) * fade).toFixed(3); } }

    // «Plan B» nace de las manos (REV medido en la base); la «B» en lima (producto)
    const REV = [[9.92, 0], [10.00, 50], [10.10, 220], [10.20, 370], [10.30, 480], [10.38, 560]];
    let half = 0; for (let i = 0; i < REV.length; i++) { if (t >= REV[i][0]) half = REV[i][1]; if (i > 0 && t >= REV[i - 1][0] && t < REV[i][0]) half = mix(REV[i - 1][1], REV[i][1], prog(t, REV[i - 1][0], REV[i][0] - REV[i - 1][0])); }
    const hp = $("heroPB"), rp = clamp01(half / 420), hpO = prog(t, 11.10, 0.25), hpOn = t >= 9.92 && t < 11.4;
    hp.style.opacity = hpOn ? (prog(t, 9.92, 0.05) * (1 - hpO)).toFixed(3) : 0;
    hp.style.clipPath = `inset(-80px ${Math.max(0, 540 - half).toFixed(1)}px -80px ${Math.max(0, 540 - half).toFixed(1)}px)`;
    hp.style.transform = `translateY(${(-60 * hpO).toFixed(1)}px) scaleX(${mix(0.62, 1, expoOut(rp)).toFixed(3)}) scaleY(${mix(0.9, 1, expoOut(rp)).toFixed(3)})`;
    hp.style.filter = `blur(${(9 * (1 - rp) + 10 * hpO).toFixed(1)}px) ${GLOW}`;
    $("hpB").style.transform = `scale(${t >= 10.62 ? mix(1.25, 1, backOut(prog(t, 10.62, 0.3), 1.6)).toFixed(3) : 1})`;
    ["rvL", "rvR"].forEach((id, k) => { const el = $(id), on = hpOn && t < 10.45;
      el.style.left = (540 + (k ? 1 : -1) * half).toFixed(1) + "px";
      el.style.opacity = on ? (prog(t, 9.92, 0.05) * (1 - prog(t, 10.25, 0.18))).toFixed(3) : 0; el.style.filter = GLOW; });

    $("flash").style.opacity = (0.9 * easeIn(prog(t, 12.70, 0.25))).toFixed(3);
  }

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
