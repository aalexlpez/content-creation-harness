    if (gi !== shownB) { el.innerHTML = gi < 0 ? "" : GR[gi].map((w) => `<span>${clean(w[0])}</span>`).join(""); shownB = gi; }
    if (gi < 0 || hide >= 1) { el.style.opacity = 0; return; }
    const est = GR[gi].reduce((a, w) => a + clean(w[0]).length * 0.72 * 66 + 24, 0) + 14 * (GR[gi].length - 1);
    const fit = est > 980 ? 980 / est : 1;
    let act = 0; GR[gi].forEach((w, i) => { if (t >= w[1] - 0.03) act = i; });
    [...el.children].forEach((sp, i) => { sp.className = i === act ? "on" : i > act ? "off" : ""; });
    const ci = expoOut(prog(t, GR[gi][0][1] - 0.05, 0.16)), co = prog(t, GR[gi].end - 0.12, 0.12);
    el.style.opacity = (ci * (1 - co) * (1 - hide)).toFixed(3);
    el.style.transform = `translateY(${(y + 12 * (1 - ci)).toFixed(1)}px) scale(${fit.toFixed(4)})`;
  }

  function render(t) {
    // ── Recursos
    const br = brAt(t);
    BR.forEach((r) => {
      if (r !== br) { r.el.style.opacity = 0; return; }
      r.el.style.opacity = 1;
      const e = expoOut(prog(t, r.a, 0.3)), push = 1 + 0.05 * prog(t, r.a, r.b - r.a);
      if (r.m === "full") r.v.style.transform = `scale(${(mix(1.08, 1, e) * push).toFixed(4)})`;
      else { const rot = -3 + 1.2 * prog(t, r.a, r.b - r.a);
        r.cd.style.transform = `translateY(${(40 * (1 - e)).toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${mix(0.92, 1, e).toFixed(4)})`; r.v.style.transform = `scale(${push.toFixed(4)})`; }
    });

    // ── Cámara y demo (la cara se desenfoca y oscurece detrás del celular)
    const s = amount(t, [[DEMO[0], DEMO[1]]]);
    let shake = 0;
    if (t >= 26.81 && t < 27.2) shake = 9 * Math.exp(-14 * (t - 26.81)) * Math.sin(40 * (t - 26.81));
    const z = zAt(t) * drift(t);
    $("vwrap").style.transform = `translateY(${shake.toFixed(2)}px) scale(${(z * mix(1, 1.08, s)).toFixed(4)})`;
    $("v").style.filter = s > 0.01 ? `blur(${(18 * s).toFixed(1)}px) brightness(${mix(1, 0.5, s).toFixed(3)})` : "none";

    // ── Promesa (0,4–3,0 s)
    { const pi = expoOut(prog(t, 0.40, 0.35)), po = easeIn(prog(t, 2.95, 0.25));
      const p = $("prom"); p.style.opacity = (prog(t, 0.40, 0.12) * (1 - po)).toFixed(3);
      p.style.filter = `blur(${(8 * (1 - pi) + 8 * po).toFixed(1)}px)`; p.style.transform = `translateY(${(-18 * (1 - pi)).toFixed(1)}px) scale(${mix(1.06, 1, pi).toFixed(3)})`; }

    // ── Pico 1: «HICE UNA APP» palabra a palabra, «APP» cae con el golpe
    { const el = $("hwApp"), on = t >= 3.75 && t < 4.95;
      el.style.opacity = on ? (1 - prog(t, 4.75, 0.12)).toFixed(3) : 0;
      el.style.top = "1030px";
      const word = (id, t0, size) => { const w = $(id), a = clamp01(backOut2(prog(t, t0, 0.22)));
        w.style.fontSize = size + "px"; w.style.opacity = prog(t, t0, 0.06).toFixed(3); w.style.transform = `scale(${mix(1.5, 1, a).toFixed(3)})`; };
      word("hwA", 3.79, 120); word("hwB", 4.10, 120); word("hwC", 4.42, 230);
      el.style.filter = t >= 4.42 ? GLOW : "none"; }

    // ── Pico 3: «¿Y TÚ?»
    { const el = $("hwTu"), a = clamp01(backOut2(prog(t, 26.81, 0.24)));
      el.style.top = "1060px"; el.style.fontSize = "220px";
      el.style.opacity = (prog(t, 26.81, 0.06) * (1 - prog(t, 27.50, 0.15))).toFixed(3);
      el.style.transform = `scale(${mix(1.5, 1, a).toFixed(3)})`; el.style.filter = t >= 26.81 ? GLOW : "none"; }

    // ── Capa flotante (se apaga bajo los recursos a pantalla completa)
    const hideFl = br && br.m === "full";
    NODES.forEach((n) => {
      if (n.fixed) return;
      const { o, inP, outP } = nodeAlpha(n, t);
      if (!o || hideFl) { n.el.style.opacity = 0; return; }
      const p = pos(n, t), e = expoOut(inP), x = easeIn(outP);
      const sc = mix(0.78, 1, e) * mix(1, 0.9, x) * (0.9 + 0.1 * n.d) * (n.pop && t >= n.pop && t < n.pop + 0.6 ? mix(1.25, 1, expoOut(prog(t, n.pop, 0.4))) : 1);
      const blur = 14 * (1 - e) + 12 * x + (1 - n.d) * 2.2;
      const rot = 1.6 * Math.sin(TAU * t / (n.px * 3) + n.ph) * (n.move === 0 ? 0 : 1);
      n.el.style.opacity = (e * (1 - x) * (0.88 + 0.12 * n.d)).toFixed(3);
      n.el.style.transform = `translate(${(p[0] - n.w / 2).toFixed(1)}px, ${(p[1] - n.h / 2).toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
      n.el.style.filter = `blur(${blur.toFixed(1)}px)`;
    });
    $("phl").textContent = t >= 9.02 && t < 13 ? "01 /" : "PLAN B";
    // precio tachado → GRATIS («gratis» 11,42)
    $("gSt").style.transform = `rotate(-12deg) scaleX(${easeOut(prog(t, 11.30, 0.15)).toFixed(3)})`;
    if (t >= 11.42) swapOut($("gPr"), t, 11.42, 0.2); else { $("gPr").style.opacity = 1; $("gPr").style.filter = "none"; $("gPr").style.transform = "none"; }
    $("gSt").style.opacity = t >= 11.42 ? (1 - prog(t, 11.42, 0.18)).toFixed(3) : 1;
    if (t < 11.40) $("gGr").style.opacity = 0; else swapIn($("gGr"), t, 11.45, 0.3);

    // ── Flechas (sin resplandor)
    ARROWS.forEach((a) => {
      const p = easeOut(prog(t, a.t0, 0.55)), fade = 1 - prog(t, a.t1 - 0.25, 0.25);
      if (t < a.t0 || t >= a.t1 || hideFl) { a.p.style.opacity = 0; a.h.style.opacity = 0; a.o.style.opacity = 0; return; }
      const A = anch(a.a, a.as, t), B = anch(a.b, a.bs, t);
      const cx = (A[0] + B[0]) / 2, cy = a.apex === null ? (A[1] + B[1]) / 2 : (a.apex - 0.25 * (A[1] + B[1])) / 0.5;
      a.p.setAttribute("d", `M ${A[0].toFixed(1)} ${A[1].toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
      a.p.setAttribute("stroke-dashoffset", (1 - p).toFixed(3)); a.p.style.opacity = fade.toFixed(3);
      const th = Math.atan2(B[1] - cy, B[0] - cx), L = 26;
      a.h.setAttribute("d", `M ${(B[0] - L * Math.cos(th - 0.55)).toFixed(1)} ${(B[1] - L * Math.sin(th - 0.55)).toFixed(1)} L ${B[0].toFixed(1)} ${B[1].toFixed(1)} L ${(B[0] - L * Math.cos(th + 0.55)).toFixed(1)} ${(B[1] - L * Math.sin(th + 0.55)).toFixed(1)}`);
      a.h.style.opacity = (prog(t, a.t0 + 0.42, 0.12) * fade).toFixed(3);
      const u = ((t - a.t0) * 0.42) % 1, v = 1 - u;
      a.o.setAttribute("cx", (v * v * A[0] + 2 * v * u * cx + u * u * B[0]).toFixed(1)); a.o.setAttribute("cy", (v * v * A[1] + 2 * v * u * cy + u * u * B[1]).toFixed(1));
      a.o.style.opacity = (prog(t, a.t0 + 0.6, 0.2) * fade * 0.95).toFixed(3);
    });

    // ── «Plan B» nace del gesto de Ale: las manos juntas en el centro (9,9 s) se abren hacia los lados (10,0–10,35 s) y la
    // palabra aparece entre ellas, a la altura de las manos. REV = media anchura visible (px) medida fotograma a fotograma.
    const REV = [[9.92, 0], [10.00, 50], [10.10, 220], [10.20, 370], [10.30, 480], [10.38, 560]];
    let half = 0; for (let i = 0; i < REV.length; i++) { if (t >= REV[i][0]) half = REV[i][1]; if (i > 0 && t >= REV[i - 1][0] && t < REV[i][0]) half = mix(REV[i - 1][1], REV[i][1], prog(t, REV[i - 1][0], REV[i][0] - REV[i - 1][0])); }
    const hp = $("heroPB"), rp = clamp01(half / 420), hpO = prog(t, 11.15, 0.3), hpOn = t >= 9.92 && t < 11.5;
    hp.style.opacity = hpOn ? (prog(t, 9.92, 0.05) * (1 - hpO)).toFixed(3) : 0;
    hp.style.clipPath = `inset(-80px ${Math.max(0, 540 - half).toFixed(1)}px -80px ${Math.max(0, 540 - half).toFixed(1)}px)`;
    hp.style.transform = `scaleX(${mix(0.62, 1, expoOut(rp)).toFixed(3)}) scaleY(${mix(0.9, 1, expoOut(rp)).toFixed(3)})`;
    hp.style.filter = `blur(${(9 * (1 - rp) + 10 * hpO).toFixed(1)}px) ${GLOW}`;
    $("hpA").style.transform = "none"; $("hpB").style.opacity = 1;
    $("hpB").style.transform = `scale(${t >= 10.62 ? mix(1.18, 1, expoOut(prog(t, 10.62, 0.3))).toFixed(3) : 1})`;
    ["rvL", "rvR"].forEach((id, k) => { const el = $(id), on = hpOn && t < 10.45;
      el.style.left = (540 + (k ? 1 : -1) * half).toFixed(1) + "px";
      el.style.opacity = on ? (prog(t, 9.92, 0.05) * (1 - prog(t, 10.25, 0.18))).toFixed(3) : 0;
      el.style.filter = GLOW; });

    // ── Celular de la demo: nace del teléfono flotante, encuadra la app y vuelve al teléfono
    const dev = $("dev");
    if (t >= DEMO[0] && t < DEMO[1] + 0.05) {
      let cy = FRAMES[0][1], zs = FRAMES[0][2];
      for (let i = 1; i < FRAMES.length; i++) {
        const [, ya, sa] = FRAMES[i - 1], [tb, yb, sb] = FRAMES[i];
        if (t >= tb + MOVE) { cy = yb; zs = sb; continue; }
        if (t >= tb) { const q = easeIO(prog(t, tb, MOVE)); cy = mix(ya, yb, q); zs = mix(sa, sb, q); } else { cy = ya; zs = sa; }
        break;
      }
      let S = Math.max(1, zs / K0);
      const f = clamp01((S - 1) / 0.25);
      let dx = 0, dy = -(cy - HREC / 2) * K0 * S * f;
      let ry = -9 * (1 - f) + 1.2 * Math.sin(TAU * t / 7), rx = 4 * (1 - f);
      S *= 1 + 0.035 * Math.exp(-7 * Math.max(0, t - 21.37)) * (t >= 21.37 ? 1 : 0);   // golpe del plan (pico 2)
      const P1 = pos(NB.phone, DEMO[0]), P2 = pos(NB.phone, DEMO[1]), sN = 190 / PW;
      const pA = easeIO(prog(t, DEMO[0], 0.5)), q = easeIO(prog(t, 24.75, 0.40));
      dx = mix(P1[0] - PCX, dx, pA); dy = mix(P1[1] - PCY, dy, pA); S = mix(sN, S, pA); ry = mix(0, ry, pA); rx = mix(0, rx, pA);
      dx = mix(dx, P2[0] - PCX, q); dy = mix(dy, P2[1] - PCY, q); S = mix(S, sN, q); ry = mix(ry, 0, q); rx = mix(rx, 0, q);
      dev.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) perspective(2200px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${S.toFixed(4)})`;
      dev.style.opacity = (prog(t, DEMO[0], 0.08) * (1 - prog(t, DEMO[1] - 0.05, 0.1))).toFixed(3);
    } else dev.style.opacity = 0;

    // ── Subtítulos (siempre en caja): a cámara 1190, con tarjeta en el pecho 1420, en la demo 1440. Se apagan con los protagonistas
    const inDemo = s > 0.5;
    capB.classList.add("boxed");   // siempre en caja: se lee sobre el estampado de la camiseta y sobre la app
    const hide = Math.max(t >= 3.75 && t < 4.85 ? 1 : 0, hpOn ? prog(t, 9.90, 0.06) * (1 - hpO) : 0, t >= 26.78 && t < 27.55 ? 1 : 0);
    // zona segura: a cámara 1190 (en caja sobre la camiseta); con tarjeta en el pecho, justo debajo (1420); en la demo 1440
    captions(t, capB, inDemo ? 1440 : br && br.m === "over" ? 1420 : 1190, hide);

    // ── Hoja ENERO → FEBRERO del cierre («no las dejo en enero»)
    const si = prog(t, 25.25, 0.4), so = 1 - prog(t, 27.15, 0.25);
    $("sheet").style.opacity = (t >= 25.2 ? si * so : 0).toFixed(3);
    $("sheet").style.transform = `rotate(-6deg) scale(${mix(0.85, 1, expoOut(si)).toFixed(3)})`;
    let ang = 0, front = true;
    if (t >= 26.30) { const p = prog(t, 26.30, 0.5); ang = Math.min(360 * p * p, 360); front = p * p < 0.25; }
    $("pEne").style.transform = `rotateX(${ang.toFixed(2)}deg)`;
    $("pEne").style.zIndex = front ? 2 : 0;
    $("tEne").style.opacity = (0.45 * clamp01(Math.sin(Math.PI * ang / 360) * 1.2)).toFixed(3);

    // ── Acento final «Este año, sí.» (después de «¿Y tú?»; responde a «este año no las dejo en enero»)
    const a1 = expoOut(prog(t, 27.55, 0.45)), a2 = clamp01(backOut(prog(t, 27.85, 0.4)));
    $("accent").style.opacity = a1.toFixed(3);
    $("accent").style.clipPath = `inset(-40px ${(100 * (1 - a1)).toFixed(1)}% -40px 0)`;
    $("a2").style.transform = `scale(${t >= 27.85 ? mix(0.3, 1, a2).toFixed(3) : 0})`;
    $("a2").style.filter = t >= 27.85 ? GLOW : "none";

    // ── Oscurecido de 3 fotogramas antes de cada empalme a cámara (no en recursos ni en la demo)
    let dip = 0; JOINTS.forEach((j) => { if (t >= j - 0.1 && t < j && !brAt(j) && !brAt(j - 0.05) && s < 0.05 && !(j > 4.3 && j < 5.0) && !(j > 26.7 && j < 27.6)) dip = 0.35; });
    $("dip").style.opacity = dip;
  }

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
</script>
</body>
</html>
