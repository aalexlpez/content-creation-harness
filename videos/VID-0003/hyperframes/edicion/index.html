  const W = window.PALABRAS, C = window.CORTE, D = C.D, JOINTS = C.juntas;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));

  const prog = (t, a, d) => clamp01((t - a) / d);
  const easeIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p * p;
  const expoOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
  const backOut = (p, c1 = 1.7) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

  const wd = (txt, k = 1) => W.filter((w) => clean(w[0]).toLowerCase() === txt)[k - 1];
  const wt = (txt, k = 1) => wd(txt, k)[1];

    el.innerHTML = text.split("").map((c) => { if (c === " ") return `<span class="ch" style="width:0.28em"></span>`;
      const s = `<span class="ch gtx" style="background-image:${grad};background-size:${n * 100}% 100%;background-position-x:${n > 1 ? (k / (n - 1)) * 100 : 0}%">${c}</span>`; k++; return s; }).join(""); };

  const NB = {}; NODES.forEach((n, i) => { NB[n.id] = n; n.ph = (i * 2.399) % TAU; n.px = 3.4 + (i % 4) * 0.6; n.py = 4.2 + (i % 3) * 0.7; });

  const showEnd = (id, t0) => { const n = NB[id]; const iv = n.show.find(([a, b]) => t0 >= a - 0.001 && t0 < b); return iv ? iv[1] : -Infinity; };
  ARROWS.forEach((a) => { a.t1 = Math.min(a.t1, showEnd(a.a, a.t0), showEnd(a.b, a.t0)); });
  const fl = $("fl"), ar = $("ar");
  NODES.forEach((n) => { const el = document.createElement("div"); el.className = "nd"; el.style.width = n.w + "px"; el.style.height = n.h + "px"; el.innerHTML = n.html; fl.appendChild(el); n.el = el; });
  { const m = $("miniT"); m.innerHTML = "MINIAPP 01".split("").map((c) => `<span style="display:inline-block">${c === " " ? "&nbsp;" : c}</span>`).join(""); }
  const SV = "http://www.w3.org/2000/svg";
  ARROWS.forEach((a) => {
    a.p = document.createElementNS(SV, "path"); a.p.setAttribute("pathLength", "1"); a.p.setAttribute("stroke-dasharray", "1 1"); ar.appendChild(a.p);
    a.h = document.createElementNS(SV, "path"); ar.appendChild(a.h);

      a.p.setAttribute("d", `M ${A[0].toFixed(1)} ${A[1].toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
      a.p.setAttribute("stroke-dashoffset", (1 - p).toFixed(3)); a.p.style.opacity = fade.toFixed(3);
      const th = Math.atan2(B[1] - cy, B[0] - cx), L = 26;
      a.h.setAttribute("d", `M ${(B[0] - L * Math.cos(th - 0.55)).toFixed(1)} ${(B[1] - L * Math.sin(th - 0.55)).toFixed(1)} L ${B[0].toFixed(1)} ${B[1].toFixed(1)} L ${(B[0] - L * Math.cos(th + 0.55)).toFixed(1)} ${(B[1] - L * Math.sin(th + 0.55)).toFixed(1)}`);
      a.h.style.opacity = (prog(t, a.t0 + 0.42, 0.12) * fade).toFixed(3);
      const u = ((t - a.t0) * 0.42) % 1, v = 1 - u;
      a.o.setAttribute("cx", (v * v * A[0] + 2 * v * u * cx + u * u * B[0]).toFixed(1)); a.o.setAttribute("cy", (v * v * A[1] + 2 * v * u * cy + u * u * B[1]).toFixed(1));
      a.o.style.opacity = (prog(t, a.t0 + 0.6, 0.2) * fade * 0.95).toFixed(3);
    });

    // ── Celular de la demo (de la base)
    const dev = $("dev");
    if (t >= DEMO[0] && t < DEMO[1] + 0.05) {
      let cy = FRAMES[0][1], zs = FRAMES[0][2];
      for (let i = 1; i < FRAMES.length; i++) {
        const [, ya, sa] = FRAMES[i - 1], [tb, yb, sb] = FRAMES[i];
        if (t >= tb + MOVE) { cy = yb; zs = sb; continue; }
        if (t >= tb) { const q = easeIO(prog(t, tb, MOVE)); cy = mix(ya, yb, q); zs = mix(sa, sb, q); } else { cy = ya; zs = sa; }
        break;
      }
      let S = Math.max(1, zs / K0);
      const f = clamp01((S - 1) / 0.25);
      let dx = 0, dy = -(cy - HREC / 2) * K0 * S * f;
      let ry = -9 * (1 - f) + 1.2 * Math.sin(TAU * t / 7), rx = 4 * (1 - f);
      S *= 1 + 0.035 * Math.exp(-7 * Math.max(0, t - 21.37)) * (t >= 21.37 ? 1 : 0);
      const P1 = pos(NB.phone, DEMO[0]), P2 = pos(NB.phone, DEMO[1]), sN = 190 / PW;
      const pA = easeIO(prog(t, DEMO[0], 0.5)), q = easeIO(prog(t, 24.75, 0.40));
      dx = mix(P1[0] - PCX, dx, pA); dy = mix(P1[1] - PCY, dy, pA); S = mix(sN, S, pA); ry = mix(0, ry, pA); rx = mix(0, rx, pA);
      dx = mix(dx, P2[0] - PCX, q); dy = mix(dy, P2[1] - PCY, q); S = mix(S, sN, q); ry = mix(ry, 0, q); rx = mix(rx, 0, q);
      dev.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) perspective(2200px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${S.toFixed(4)})`;
      dev.style.opacity = (prog(t, DEMO[0], 0.08) * (1 - prog(t, DEMO[1] - 0.05, 0.1))).toFixed(3);
    } else dev.style.opacity = 0;

    // ── Nivel 1: frases (en la demo, en caja)
    phrases(t, s > 0.5, br);

    // ── Acento final «Este año, sí.» y J · CTA como componente
    { const a1 = expoOut(prog(t, 27.55, 0.45)), a2 = clamp01(backOut(prog(t, 27.85, 0.4)));
      $("accent").style.opacity = a1.toFixed(3); $("accent").style.clipPath = `inset(-40px ${(100 * (1 - a1)).toFixed(1)}% -40px 0)`;
      $("a2").style.transform = `scale(${t >= 27.85 ? mix(0.3, 1, a2).toFixed(3) : 0})`; }
    { const a = T.J, c = $("cta"), e = expoOut(prog(t, a, 0.5));
      c.style.opacity = t >= a ? clamp01((t - a) / 0.15).toFixed(3) : 0;
      c.style.transform = `translateY(${(180 * (1 - e)).toFixed(1)}px) scale(${mix(0.92, 1, e).toFixed(3)})`; c.style.filter = `blur(${(12 * (1 - e)).toFixed(1)}px)`;
      const tp = wt("perfil"), press = t >= tp ? Math.sin(Math.PI * prog(t, tp, 0.22)) : 0;
      $("ctaB").style.transform = `scale(${(1 - 0.07 * press).toFixed(3)})`;
      $("ctaB").style.opacity = prog(t, a + 0.25, 0.2).toFixed(3); $("ctaT").style.opacity = prog(t, a + 0.15, 0.2).toFixed(3); }

    // ── Oscurecido de 3 fotogramas antes de los empalmes a cámara (no en recursos, demo ni picos)
    let dip = 0; JOINTS.forEach((j) => { if (t >= j - 0.1 && t < j && !brAt(j) && !brAt(j - 0.05) && s < 0.05 && !(j > 4.3 && j < 5.0) && !(j > 26.7 && j < 27.6)) dip = 0.35; });
    $("dip").style.opacity = dip;
  }

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
</script>
