<!--
  EDICIÓN CONTINUA v05 de VID-0002 sobre el corte de Ale en CapCut (ensayo_2.mp4) con su voz mejorada. No se publica.
  Plan: PLAN_v05.md. Método E-01 (AV-009) + estándar de motion graphics (guias/MOTION.md, AV-010).
  Marca v2 (AV-006/007): #0B0B0D, #1E2937, #0D213F, #F5F6F8, secundario #B7C0CC, solo Plus Jakarta Sans, sin acento,
  énfasis por inversión, sin degradados, resplandores ni sombras difusas.
  Tiempos: media/trabajo/corte_palabras.json. La composición está escrita en tiempos del corte v01 («viejos») y
  render() traduce el tiempo del corte v05 con KEEP (= cortes.py = mezcla_v05.py).

  Qué trae la v05 frente a la v04 (versiones/edicion_v04.html.txt):
    - Textos en tres niveles: subtítulo base, 6 palabras protagonistas (ABANDONASTE y CALMA detrás de la persona con
      el recorte de HyperFrames, «Plan B» que llena el cuadro, SIN GANAS, GRATIS, «Este febrero, no.») y cabecera «n / 5».
    - Cortes: encuadre que alterna 100 % / 110 % en cada empalme de KEEP y por frase, con oscurecido de 3 fotogramas
      antes de cada empalme.
    - Transiciones con causa: la hoja de calendario se atraviesa hasta el escenario (zoom a través), la tarjeta Plan B se
      ensancha hasta ser la ventana de la demo, la pantalla de bloqueo se encoge hasta la tarjeta 01 (llevar al otro
      lado) y el escenario entra con desenfoque.
    - Demo con dos insertos a pantalla completa de ≤ 1,3 s (el toque en «No tuve tiempo» y el sello).
    - «La serie»: una tarjeta protagonista de 260 px por categoría en vez de una fila de iconos pequeños.
    - El calendario dice «MEDIADOS DE ENERO»: «la mitad» es el claim C1 (X) y no se refuerza en pantalla.
    - Cola de 0,8 s con el último fotograma. La voz ya no viaja en el vídeo: va en voz_v05.wav y se mezcla aparte.
-->

<script>
(function () {
  const D = 56.43;
  // Tramos del corte v01 que se conservan (tiempo viejo), medidos en silencios de la voz. = cortes.py = mezcla_v05.py
  const KEEP = [[0, 32.60], [33.60, 49.00], [49.86, 52.20], [56.64, 60.15], [61.62, 63.25]];
  const oldT = (tn) => { let acc = 0; for (const [a, b] of KEEP) { if (tn <= acc + (b - a)) return a + (tn - acc); acc += b - a; } return KEEP[KEEP.length - 1][1]; };
  const kept = (to) => KEEP.some(([a, b]) => to >= a && to < b);
  const JOINTS = (() => { let acc = 0; const j = []; KEEP.forEach(([a, b], i) => { acc += b - a; if (i < KEEP.length - 1) j.push(acc); }); return j; })();   // empalmes en tiempo nuevo
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const mix = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, d) => clamp01((t - a) / d);
  const easeIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p * p;
  const expoOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
  const backOut = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const backOut2 = (p) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const $ = (id) => document.getElementById(id);
  const CHECK = (c) => `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  // aparición con resorte (escala) y opacidad sin rebote
  const popIn = (el, t, t0, from = 0.7, base = "") => {
    const a = clamp01(backOut(prog(t, t0 - 0.06, 0.42)));
    el.style.opacity = prog(t, t0 - 0.06, 0.12).toFixed(3);
    el.style.transform = `${base} scale(${(t >= t0 - 0.06 ? mix(from, 1, a) : from).toFixed(4)})`;
  };
  // cambio de estado de texto/icono: el que sale se desenfoca y baja; el que entra sube y se enfoca (text-state-swap, icon-swap)
  const swapOut = (el, t, t0, d = 0.2) => { const p = easeIn(prog(t, t0, d)); el.style.opacity = (1 - p).toFixed(3); el.style.filter = `blur(${(7 * p).toFixed(1)}px)`; el.style.transform = `scale(${mix(1, 0.86, p).toFixed(3)})`; };

      const names = [null, "PLAN B", "PRODUCTIVIDAD", "CIENCIA", "MINIJUEGOS"];
      $("hcl").textContent = names[st]; $("hck").textContent = "0" + st;
      $("hc").className = st === 1 ? "inv" : "";
      $("hck").style.color = st === 1 ? "#0B0B0D" : "#F5F6F8"; $("hcl").style.color = st === 1 ? "#0B0B0D" : "#F5F6F8";
      [1, 2, 3, 4].forEach((k) => { const el = $("ic" + k); if (k === st) { if (st === 1) { el.style.opacity = 1; el.style.filter = "none"; el.style.transform = "none"; } else swapIn(el, t, tt, 0.3); } else el.style.opacity = 0; });
      $("hcl").style.opacity = ((st === 1 ? 1 : prog(t, tt + 0.08, 0.2)) * (1 - clamp01(away * 2))).toFixed(3); $("hck").style.opacity = (1 - clamp01(away * 2)).toFixed(3);
      popIn($("week1"), t, 44.65, 0.7);
      dots.forEach((d, k) => { const on = k < st; d.style.background = on ? "#F5F6F8" : "transparent"; d.style.borderColor = on ? "#F5F6F8" : "rgba(245,246,248,0.22)"; });
      $("dots").style.opacity = hcIn;
      $("dots").style.transform = `translate(${(-298 * away).toFixed(1)}px, ${(420 * away).toFixed(1)}px) scale(${mix(1, 2.4, away).toFixed(3)})`;
    }

    // ── Ventana de la demo: se ensancha desde la tarjeta Plan B, sigue el paso activo, hace dos insertos a pantalla
    //    completa (toque en «No tuve tiempo» y sello) y se encoge hasta la tarjeta «01» de la serie (llevar al otro lado)
    let ins = 0;
    if (t >= 22.70 && t < 41.60) {
      let cy = FRAMES[0][1], zs = FRAMES[0][2];
      for (let i = 1; i < FRAMES.length; i++) {
        const [ta, ya, sa] = FRAMES[i - 1], [tb, yb, sb] = FRAMES[i];
        if (t >= tb + MOVE) { cy = yb; zs = sb; continue; }
        if (t >= tb) { const q = easeIO(prog(t, tb, MOVE)); cy = mix(ya, yb, q); zs = mix(sa, sb, q); } else { cy = ya; zs = sa; }
        break;
      }
      const ww0 = Math.min(960, 1080 * zs);
      const base = [(1080 - ww0) / 2, 330, ww0, 520, 28];
      const pA = easeIO(prog(t, 22.70, 0.55));
      let R = lerpR(R_PB, base, pA), m = 1 - pA;
      const i1 = easeIO(prog(t, 29.45, 0.30)) * (1 - easeIO(prog(t, 30.95, 0.35)));
      const i2 = easeIO(prog(t, 37.40, 0.30)) * (1 - easeIO(prog(t, 38.95, 0.35)));
      ins = Math.max(i1, i2);
      R = lerpR(R, R_FULL, ins); m = Math.max(m, ins);
      const q = easeIO(prog(t, 40.97, 0.43));
      R = lerpR(R, R_HC, q); m = Math.max(m, q);
      const zsE = mix(zs, R[2] / 1080, m), cyE = mix(cy, 960, m);
      const winH = R[3] / zsE, top = Math.max(0, Math.min(1920 - winH, cyE - winH / 2));
      const w = $("appwin");
      w.style.left = R[0].toFixed(1) + "px"; w.style.top = R[1].toFixed(1) + "px"; w.style.width = R[2].toFixed(1) + "px"; w.style.height = R[3].toFixed(1) + "px"; w.style.borderRadius = R[4].toFixed(1) + "px";
      $("appin").style.transform = `translate(${((R[2] - 1080 * zsE) / 2).toFixed(1)}px, ${(-top * zsE).toFixed(1)}px) scale(${zsE.toFixed(4)})`;
      w.style.background = t >= 41.0 ? "#171421" : "#F7F5F0";
      w.style.opacity = (prog(t, 22.70, 0.12) * (1 - prog(t, 41.32, 0.15))).toFixed(3);
    } else $("appwin").style.opacity = 0;

    // ── Subtítulos: banda del escenario (y 862), a cámara (y 1190) o, en los insertos, sobre la maqueta (y 1330, cajas marinas)
    capB.classList.toggle("boxed", ins > 0.5);
    captions(t, capB, mix(mix(1190, 862, s), 1330, ins));

    // ── Hoja de calendario del gancho (MG-01): visible ya en el fotograma 0; en 4,28 se atraviesa hasta el calendario del escenario
    const zt = easeIn(prog(t, 4.26, 0.34)), sheetFade = 1 - prog(t, 4.52, 0.14);
    $("sheet").style.opacity = sheetFade.toFixed(3);
    $("sheet").style.transform = `translate(${(354 * zt).toFixed(1)}px, ${(150 * zt).toFixed(1)}px) rotate(${(-6 * (1 - zt)).toFixed(2)}deg) scale(${(1 + 4.9 * zt).toFixed(3)})`;
    let ang = 0, front = true;
    if (t >= 0.30 && t < 3.82) { const p = prog(t, 0.30, 0.55); ang = 360 * p * p; front = p * p < 0.25; }
    else if (t >= 3.82) { const p = prog(t, 3.82, 0.5); const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; ang = 360 * (1 - e); front = (1 - e) < 0.25; }
    $("pEne").style.transform = `rotateX(${ang.toFixed(2)}deg)`;
    $("pEne").style.zIndex = front ? 2 : 0;
    $("tEne").style.opacity = (0.45 * clamp01(Math.sin(Math.PI * ang / 360) * 1.2)).toFixed(3);

    // ── Acento final: «Este febrero,» en «antes» y cae «no.» en «febrero» (golpe 3 de 3)
    const a1 = expoOut(prog(t, 58.84, 0.5)), a2 = clamp01(backOut(prog(t, 59.56, 0.4)));
    $("accent").style.opacity = a1.toFixed(3);
    $("accent").style.clipPath = `inset(0 ${(100 * (1 - a1)).toFixed(1)}% 0 0)`;
    $("a2").style.transform = `scale(${t >= 59.56 ? mix(0.3, 1, a2).toFixed(3) : 0})`;

    // ── Oscurecido de 3 fotogramas (≈ 40 %) antes de cada empalme de la voz: el corte se lee como intencional
    let dip = 0; JOINTS.forEach((j) => { if (tn >= j - 0.1 && tn < j) dip = 0.4; });
    $("dip").style.opacity = dip;
  }

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
</script>
