    // calendario de enero: días 1–14 marcados cada vez más rápido; se para a mediados; las marcas caen
    const markAt = (i) => 4.95 + 1.10 * (1 - Math.pow(1 - i / 14, 1.6));
    cells.forEach((c, i) => {
      const marked = i < 14, on = marked ? prog(t, markAt(i), 0.08) : 0, f = marked ? easeIn(prog(t, 6.30 + 0.02 * (13 - i), 0.35)) : 0;
      c.querySelector("i").style.opacity = (on * (1 - f)).toFixed(3);
      c.style.transform = marked ? `translateY(${(60 * f).toFixed(1)}px)` : "";
      c.style.opacity = marked ? 1 : (1 - 0.6 * easeOut(prog(t, 6.2, 0.3))).toFixed(3);
    });
    // semana: se marca todo menos el jueves
    rowEls.forEach((r, k) => { r.querySelector("svg").style.opacity = (k === 3 ? 0 : prog(t, 10.95 + 0.08 * k, 0.1)).toFixed(3); r.style.opacity = (k === 3 ? 1 : 1 - 0.55 * easeOut(prog(t, 11.4, 0.3))).toFixed(3); });
    // precio tachado → GRATIS
    $("gSt").style.transform = `rotate(-12deg) scaleX(${easeOut(prog(t, 17.0, 0.2)).toFixed(3)})`;
    if (t >= 17.2) swapOut($("gPr"), t, 17.2, 0.22); else { $("gPr").style.opacity = 1; $("gPr").style.filter = "none"; $("gPr").style.transform = "none"; }
    $("gSt").style.opacity = t >= 17.2 ? (1 - prog(t, 17.2, 0.2)).toFixed(3) : 1;
    if (t < 17.1) $("gGr").style.opacity = 0; else swapIn($("gGr"), t, 17.24, 0.3);
    $("phl").textContent = (t >= 21.64 && t < 22.7) || (t >= 42.36 && t < 56) ? "01 /" : "PLAN B";

    // ── Flechas (sin resplandor)
    ARROWS.forEach((a) => {
      const p = easeOut(prog(t, a.t0, 0.55)), fade = 1 - prog(t, a.t1 - 0.25, 0.25);
      if (t < a.t0 || t >= a.t1 || hideFl) { a.p.style.opacity = 0; a.h.style.opacity = 0; a.o.style.opacity = 0; return; }
      const A = anch(a.a, a.as, t), B = anch(a.b, a.bs, t);
      const cx = (A[0] + B[0]) / 2, cy = a.apex === null ? (A[1] + B[1]) / 2 : (a.apex - 0.25 * (A[1] + B[1])) / 0.5;
      a.p.setAttribute("d", `M ${A[0].toFixed(1)} ${A[1].toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
      a.p.setAttribute("stroke-dashoffset", (1 - p).toFixed(3)); a.p.style.opacity = fade.toFixed(3);
      const th = Math.atan2(B[1] - cy, B[0] - cx), L = 26;
      a.h.setAttribute("d", `M ${(B[0] - L * Math.cos(th - 0.55)).toFixed(1)} ${(B[1] - L * Math.sin(th - 0.55)).toFixed(1)} L ${B[0].toFixed(1)} ${B[1].toFixed(1)} L ${(B[0] - L * Math.cos(th + 0.55)).toFixed(1)} ${(B[1] - L * Math.sin(th + 0.55)).toFixed(1)}`);
      a.h.style.opacity = (prog(t, a.t0 + 0.42, 0.12) * fade).toFixed(3);
      const u = ((t - a.t0) * 0.42) % 1, v = 1 - u;
      a.o.setAttribute("cx", (v * v * A[0] + 2 * v * u * cx + u * u * B[0]).toFixed(1)); a.o.setAttribute("cy", (v * v * A[1] + 2 * v * u * cy + u * u * B[1]).toFixed(1));
      a.o.style.opacity = (prog(t, a.t0 + 0.6, 0.2) * fade * 0.95).toFixed(3);
    });

    // ── «Plan B» llena el cuadro (protagonista 1, con el estribillo)
    const hp = $("heroPB"), hpIn = expoOut(prog(t, 14.59, 0.55)), hpB = expoOut(prog(t, 14.90, 0.4)), hpO = prog(t, 16.35, 0.3);
    hp.style.opacity = (prog(t, 14.59, 0.08) * (1 - hpO)).toFixed(3);
    $("hpA").style.transform = `scale(${mix(1.9, 1, hpIn).toFixed(3)})`;
    $("hpB").style.opacity = prog(t, 14.90, 0.1).toFixed(3); $("hpB").style.transform = `translateX(${(120 * (1 - hpB)).toFixed(1)}px)`;
    hp.style.filter = `blur(${(10 * hpO).toFixed(1)}px) ${GLOW}`;

    // ── Celular de la demo: nace del teléfono flotante, encuadra la app real y vuelve al teléfono
    const dev = $("dev");
    if (t >= DEMO[0] && t < DEMO[1] + 0.05) {
      let cy = FRAMES[0][1], zs = FRAMES[0][2];
      for (let i = 1; i < FRAMES.length; i++) {
        const [, ya, sa] = FRAMES[i - 1], [tb, yb, sb] = FRAMES[i];
        if (t >= tb + MOVE) { cy = yb; zs = sb; continue; }
        if (t >= tb) { const q = easeIO(prog(t, tb, MOVE)); cy = mix(ya, yb, q); zs = mix(sa, sb, q); } else { cy = ya; zs = sa; }
        break;
      }
      let S = Math.max(1, zs / K0);
      const f = clamp01((S - 1) / 0.25);
      let dx = 0, dy = -(cy - HREC / 2) * K0 * S * f;
      let ry = -9 * (1 - f) + 1.2 * Math.sin(TAU * t / 7), rx = 4 * (1 - f);
      // golpe del plan (protagonista 2): pequeño empuje en el tiempo fuerte del estribillo
      S *= 1 + 0.035 * Math.exp(-7 * Math.max(0, t - 37.50)) * (t >= 37.50 ? 1 : 0);
      // entrada desde el teléfono flotante y salida hacia él (después de «fondo de pantalla»)
      const P1 = pos(NB.phone, DEMO[0]), P2 = pos(NB.phone, 42.36), sN = 190 / PW;
      const pA = easeIO(prog(t, DEMO[0], 0.55)), q = easeIO(prog(t, 41.95, 0.40));
      dx = mix(P1[0] - PCX, dx, pA); dy = mix(P1[1] - PCY, dy, pA); S = mix(sN, S, pA); ry = mix(0, ry, pA); rx = mix(0, rx, pA);
      dx = mix(dx, P2[0] - PCX, q); dy = mix(dy, P2[1] - PCY, q); S = mix(S, sN, q); ry = mix(ry, 0, q); rx = mix(rx, 0, q);
      dev.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) perspective(2200px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${S.toFixed(4)})`;
      dev.style.opacity = (prog(t, DEMO[0], 0.08) * (1 - prog(t, 42.30, 0.12))).toFixed(3);
    } else dev.style.opacity = 0;

    // ── Subtítulos: a cámara 1190; sobre tarjeta 1330; en la demo, en caja, 1600. Se apagan con las palabras protagonistas
    const inDemo = s > 0.5;
    capB.classList.toggle("boxed", inDemo);
    const hide = coOn ? 1 : Math.max(hbA, hbC, prog(t, 14.59, 0.08) * (1 - hpO));
    captions(t, capB, inDemo ? 1600 : br && br.m === "card" ? 1330 : br && br.m === "over" ? 1500 : 1190, hide);

    // ── Hoja de calendario del cierre (ENERO → FEBRERO)
    const t7i = prog(t, 57.6, 0.4), t7o = 1 - prog(t, 61.4, 0.3);
    $("sheet").style.opacity = (t >= 57.0 ? t7i * t7o : 0).toFixed(3);
    $("sheet").style.transform = `rotate(-6deg) scale(${mix(0.85, 1, expoOut(t7i)).toFixed(3)})`;
    let ang = 0, front = true;
    if (t >= 59.2) { const p = prog(t, 59.2, 0.55); ang = Math.min(360 * p * p, 360); front = p * p < 0.25; }
    $("pEne").style.transform = `rotateX(${ang.toFixed(2)}deg)`;
    $("pEne").style.zIndex = front ? 2 : 0;
    $("tEne").style.opacity = (0.45 * clamp01(Math.sin(Math.PI * ang / 360) * 1.2)).toFixed(3);

    // ── Acento final (protagonista 3): «no.» cae con el golpe de la música tras 0,4 s de silencio
    const a1 = expoOut(prog(t, 58.84, 0.5)), a2 = clamp01(backOut(prog(t, 59.56, 0.4)));
    $("accent").style.opacity = a1.toFixed(3);
    $("accent").style.clipPath = `inset(-40px ${(100 * (1 - a1)).toFixed(1)}% -40px 0)`;
    $("a2").style.transform = `scale(${t >= 59.56 ? mix(0.3, 1, a2).toFixed(3) : 0})`;
    $("a2").style.filter = t >= 59.56 ? GLOW : "none";

    // ── Oscurecido de 3 fotogramas antes de cada empalme a cámara (no en recursos ni en la demo)
    let dip = 0; JOINTS.forEach((j) => { if (tn >= j - 0.1 && tn < j && !brAt(j) && s < 0.05) dip = 0.4; });
    $("dip").style.opacity = dip;
  }

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
</script>
