      const w = $("appwin");
      w.style.left = R[0].toFixed(1) + "px"; w.style.top = R[1].toFixed(1) + "px"; w.style.width = R[2].toFixed(1) + "px"; w.style.height = R[3].toFixed(1) + "px"; w.style.borderRadius = R[4].toFixed(1) + "px";
      $("appin").style.transform = `translate(${((R[2] - 1080 * zsE) / 2).toFixed(1)}px, ${(-top * zsE).toFixed(1)}px) scale(${zsE.toFixed(4)})`;
      w.style.background = t >= 41.0 ? "#171421" : "#F7F5F0";
      w.style.opacity = (prog(t, 22.70, 0.12) * (1 - prog(t, 41.32, 0.15))).toFixed(3);
    } else $("appwin").style.opacity = 0;

    // ── Subtítulos: a cámara (y 1190), en la demo (y 862) o, en los insertos, sobre la maqueta (y 1330)
    capB.classList.toggle("boxed", ins > 0.5);
    captions(t, capB, mix(mix(1190, 862, s), 1330, ins));

    // ── Hoja de calendario: en el gancho (ENERO → FEBRERO → ENERO) y en el cierre (ENERO → FEBRERO)
    const t1o = 1 - prog(t, 4.30, 0.2), t7i = prog(t, 57.6, 0.4), t7o = 1 - prog(t, 61.4, 0.3);
    const inT7 = t >= 57.0;
    $("sheet").style.opacity = (inT7 ? t7i * t7o : t1o).toFixed(3);
    $("sheet").style.transform = inT7 ? `translate(0px, 250px) rotate(-6deg) scale(${mix(0.85, 1, expoOut(t7i)).toFixed(3)})` : `translate(0px, ${(-30 * (1 - t1o)).toFixed(1)}px) rotate(-6deg)`;
    let ang = 0, front = true;
    if (!inT7) {
      if (t >= 0.30 && t < 3.82) { const p = prog(t, 0.30, 0.55); ang = 360 * p * p; front = p * p < 0.25; }
      else if (t >= 3.82) { const p = prog(t, 3.82, 0.5); const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; ang = 360 * (1 - e); front = (1 - e) < 0.25; }
    } else if (t >= 59.2) { const p = prog(t, 59.2, 0.55); ang = 360 * p * p; front = p * p < 0.25; ang = Math.min(ang, 360); }
    $("pEne").style.transform = `rotateX(${ang.toFixed(2)}deg)`;
    $("pEne").style.zIndex = front ? 2 : 0;
    $("tEne").style.opacity = (0.45 * clamp01(Math.sin(Math.PI * ang / 360) * 1.2)).toFixed(3);

    // ── Acento final
    const a1 = expoOut(prog(t, 58.84, 0.5)), a2 = clamp01(backOut(prog(t, 59.56, 0.4)));
    $("accent").style.opacity = a1.toFixed(3);
    $("accent").style.clipPath = `inset(0 ${(100 * (1 - a1)).toFixed(1)}% 0 0)`;
    $("a2").style.transform = `scale(${t >= 59.56 ? mix(0.3, 1, a2).toFixed(3) : 0})`;

    // ── Oscurecido de 3 fotogramas antes de cada empalme
    let dip = 0; JOINTS.forEach((j) => { if (tn >= j - 0.1 && tn < j) dip = 0.4; });
    $("dip").style.opacity = dip;
  }

  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
})();
</script>
