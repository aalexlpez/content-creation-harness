name: validar

on:
  push:
  pull_request:

jobs:
  marco:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validar el marco
        run: python scripts/marco.py validar
      - name: Pruebas
        run: python -m unittest discover -s pruebas -v
